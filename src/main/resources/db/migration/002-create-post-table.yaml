databaseChangeLog:
  - changeSet:
      id: 002-create-post-table
      author: system
      changes:
        - createTable:
            tableName: post
            columns:
              - column:
                  name: id
                  type: varchar(50)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
              - column:
                  name: is_home
                  type: boolean
                  defaultValue: true
              - column:
                  name: category_id
                  type: varchar(50)
                  constraints:
                    foreignKeyName: fk_post_category
                    references: category(id)
              - column:
                  name: created_by
                  type: varchar(50)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_by
                  type: varchar(50)
              - column:
                  name: last_modified_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false